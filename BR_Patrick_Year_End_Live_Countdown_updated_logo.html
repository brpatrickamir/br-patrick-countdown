<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BR-PATRICK — Year End Countdown</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; }
  body {
    background:#071a35;
    color:#fff;
    font-family: Arial, Helvetica, sans-serif;
  }
  .screen {
    width:100vw; height:100vh;
    min-height:600px;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:4vh 6vw;
    background:
      radial-gradient(circle at 85% 18%, rgba(255,214,0,.18), transparent 24%),
      linear-gradient(135deg,#06152d 0%,#0a2445 55%,#06152d 100%);
  }
  .screen:before {
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(135deg, transparent 0 70px, rgba(255,255,255,.025) 70px 72px);
    pointer-events:none;
  }
  .top {
    position:absolute; top:4vh; left:6vw; right:6vw;
    display:flex; justify-content:space-between; align-items:center;
    z-index:2;
  }
  .brand { display:flex; align-items:center; }
  .brand img { width:clamp(150px,14vw,240px); height:auto; display:block; }
  .tag {
    color:#ffd600; font-size:clamp(13px,1.2vw,20px);
    font-weight:800; letter-spacing:.12em;
  }
  .content { position:relative; z-index:2; text-align:center; }
  .eyebrow {
    color:#ffd600; font-weight:900; letter-spacing:.2em;
    font-size:clamp(14px,1.4vw,22px); margin-bottom:1vh;
  }
  h1 {
    margin:0;
    font-size:clamp(42px,6vw,105px);
    line-height:.95;
    font-weight:1000;
    text-transform:uppercase;
    letter-spacing:-.045em;
  }
  h1 .yellow { color:#ffd600; }
  .timer {
    margin:5vh auto 3vh;
    display:flex; justify-content:center; align-items:center;
    gap:clamp(8px,1.4vw,28px);
  }
  .unit {
    min-width:clamp(105px,13vw,240px);
    padding:1.4vh 1vw 1.1vh;
    border:2px solid #ffd600;
    border-radius:12px;
    background:rgba(2,12,28,.62);
    box-shadow:0 0 30px rgba(255,214,0,.08);
  }
  .num {
    font-size:clamp(48px,6.8vw,125px);
    line-height:.9;
    font-weight:1000;
    color:#ffd600;
    font-variant-numeric:tabular-nums;
  }
  .label {
    margin-top:1vh;
    font-size:clamp(11px,1.1vw,18px);
    font-weight:900; letter-spacing:.18em;
  }
  .slogan {
    display:inline-block;
    margin-top:1vh;
    padding:1.2vh 2.4vw;
    background:#ffd600;
    color:#071a35;
    font-size:clamp(17px,2vw,32px);
    font-weight:1000;
    text-transform:uppercase;
    transform:skew(-8deg);
  }
  .slogan span { display:inline-block; transform:skew(8deg); }
  .footer {
    position:absolute; bottom:3.5vh; left:6vw; right:6vw;
    display:flex; justify-content:space-between; align-items:end;
    z-index:2; font-size:clamp(12px,1.1vw,18px); font-weight:800;
  }
  .footer strong { color:#ffd600; }
  .date { opacity:.8; }
  @media (max-aspect-ratio: 1.3/1) {
    .timer { flex-wrap:wrap; }
    .unit { min-width:20vw; }
  }
</style>
</head>

<script>
  // Brunei time is UTC+8. Countdown ends at 00:00 on 1 January 2027.
  const target = new Date("2027-01-01T00:00:00+08:00");

  function pad(n, size=2) {
    return String(n).padStart(size, "0");
  }

  function update() {
    const now = new Date();
    let diff = Math.max(0, target - now);

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);

    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    document.getElementById("days").textContent = pad(days, 3);
    document.getElementById("hours").textContent = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);

  update();
  setInterval(update, 1000);
